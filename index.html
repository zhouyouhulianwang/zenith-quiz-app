<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f2f2f7" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0d0d0d" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>ZENITH - 智能题库训练</title>
    <script src="/api-config.js"></script>
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('zenith-settings');
          var theme = 'system';
          if (saved) {
            var s = JSON.parse(saved);
            if (s.theme === 'dark' || s.theme === 'light' || s.theme === 'system') {
              theme = s.theme;
            }
          }
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
          } else if (theme === 'light') {
            document.documentElement.classList.remove('dark');
          } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.classList.add('dark');
          }
        } catch(e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot-error" style="display:none;padding:20px;color:#ef4444;font-family:sans-serif;"></div>
    <script>
      // Show boot errors if React fails to render
      window.addEventListener('error', function(e) {
        var el = document.getElementById('boot-error');
        if (el) { el.style.display = 'block'; el.textContent = 'Error: ' + e.message; }
      });
      window.addEventListener('unhandledrejection', function(e) {
        var el = document.getElementById('boot-error');
        if (el) { el.style.display = 'block'; el.textContent = 'Promise Error: ' + e.reason; }
      });
      // Show loading indicator
      (function() {
        var root = document.getElementById('root');
        if (root && root.children.length === 0) {
          root.innerHTML = '<div style="display:flex;justify-content:center;align-items:center;height:100vh;color:#999;font-family:sans-serif;">Loading...</div>';
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
