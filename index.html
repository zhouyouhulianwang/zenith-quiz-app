<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f2f2f7" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0d0d0d" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>ZENITH - 智能题库训练</title>
    <script src="/api-config.js"></script>
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('zenith-settings');
          var theme = 'system';
          if (saved) {
            var s = JSON.parse(saved);
            if (s.theme === 'dark' || s.theme === 'light' || s.theme === 'system') {
              theme = s.theme;
            }
          }
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
          } else if (theme === 'light') {
            document.documentElement.classList.remove('dark');
          } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.classList.add('dark');
          }
        } catch(e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot-error" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:#fff;padding:20px;z-index:99999;font-family:sans-serif;color:#333;">
      <h3 style="color:#ef4444;">加载错误</h3>
      <pre id="boot-error-msg" style="background:#f5f5f5;padding:10px;overflow:auto;max-height:80vh;"></pre>
    </div>
    <script>
      (function() {
        var errors = [];
        function showError(msg) {
          errors.push(msg);
          var el = document.getElementById('boot-error');
          var msgEl = document.getElementById('boot-error-msg');
          if (el && msgEl) {
            el.style.display = 'block';
            msgEl.textContent = errors.join('\n');
          }
        }
        window.addEventListener('error', function(e) {
          showError('ERROR: ' + e.message + ' at ' + e.filename + ':' + e.lineno);
        });
        window.addEventListener('unhandledrejection', function(e) {
          showError('PROMISE REJECTED: ' + e.reason);
        });
        // Show loading indicator initially
        var root = document.getElementById('root');
        if (root) {
          root.innerHTML = '<div style="display:flex;justify-content:center;align-items:center;height:100vh;color:#999;font-family:sans-serif;font-size:16px;">Loading...</div>';
        }
        // After 8 seconds, if root is still empty, show error
        setTimeout(function() {
          var rootEl = document.getElementById('root');
          if (rootEl && rootEl.children.length <= 1) {
            showError('Timeout: App failed to render after 8 seconds');
          }
        }, 8000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
