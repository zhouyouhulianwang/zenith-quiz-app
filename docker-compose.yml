version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: zenith-mysql
    environment:
      MYSQL_ROOT_PASSWORD: zenith_root_pass
      MYSQL_DATABASE: zenith
      MYSQL_USER: zenith
      MYSQL_PASSWORD: zenith_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  zenith:
    build: .
    container_name: zenith-app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - DATABASE_URL=mysql://zenith:zenith_pass@mysql:3306/zenith
      - APP_ID=${APP_ID}
      - APP_SECRET=${APP_SECRET}
      - KIMI_AUTH_URL=${KIMI_AUTH_URL}
      - KIMI_OPEN_URL=${KIMI_OPEN_URL}
      - MOONSHOT_API_KEY=${MOONSHOT_API_KEY}
      - OWNER_UNION_ID=${OWNER_UNION_ID}
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql_data:
